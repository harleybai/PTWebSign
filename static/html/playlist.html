<body>
    <nav class="navbar navbar-inverse navbar-fixed-top" style="background-color: #f5f5f5">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar"
                    aria-expanded="false" aria-controls="navbar">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="/">PT Sign In</a>&nbsp;&nbsp;&nbsp;
                <a class="navbar-brand" href="#">Play List</a>&nbsp;&nbsp;&nbsp;
                <a class="navbar-brand" href="/ptgen">PT Gen</a>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-8 col-sm-offset-2 col-md-10 col-md-offset-1 main">
                <div id="toolbar" class="form-inline">
                    <button type="button" id="new_site" class="btn btn-primary"><i class="fa fa-plus-square-o"></i> New
                        Video Info
                    </button>
                    <button type="button" id="back_up" class="btn btn-primary"><i class="fa fa-clone"
                            aria-hidden="true"></i> Db Backup
                    </button>
                </div>
                <div class="table-responsive">
                    <table id="table"></table>
                </div>
                <div id="div_info"> </div>
            </div>
        </div>
    </div>
    <footer class="footer">
        <div class="container">
            <div class="navbar-collapse collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="https://github.com/harleybai/PTWebSign" target="_blank">Powered By @harleybai</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <div id="my_modal" class="modal fade" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                            aria-hidden="true">&times;</span>
                    </button>
                    <h4 class="modal-title"></h4>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <select id="searchcat" class="form-inline" hidden>
                        <!-- <option value="0">Video</option> -->
                        <!-- <option value="1">Bgm</option> -->
                        <option value="2">Douban</option>
                    </select>
                    <button type="button" id="bgm_auto_fill" class="btn btn-primary">自动填充信息</button>
                    <button type="button" id="btn_submit" class="btn btn-primary">提交</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>

    <!-- Bootstrap core JavaScript
================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="../js/jquery.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/bootstrap-table.min.js"></script>
    <script>
        // 影片类型
        const typeAnime = 1; // 动漫
        const typeMovie = 2; // 电影
        const typeTV = 3; // 电视剧
        const typeName = (t) => {
            if (t === typeAnime) return "动漫";
            else if (t === typeMovie) return "电影";
            else if (t === typeTV) return "电视剧";
            else return "未知类型";
        };
        const typeLabelCache = {};
        const labelClasses = ['label-primary', 'label-success', 'label-info', 'label-warning', 'label-danger'];
        const getRandomLabelClass = (type) => {
            if (typeLabelCache[type]) return typeLabelCache[type];
            const randomClass = labelClasses[Math.floor(Math.random() * labelClasses.length)];
            typeLabelCache[type] = randomClass;
            return randomClass;
        };
        //输入组件
        const idModel = (value = '') => {
            return `<div class="form-group">
                <label for="f_id" class="col-sm-2 control-label">ID</label>
                <div class="col-sm-10"><input id="f_id" type="text" class="form-control" value="${value}" disabled></div>
                </div>`;
        };
        const picModel = (value = '') => {
            return `<div class="form-group">
                <label for="f_pic" class="col-sm-2 control-label">海报</label>
                <div class="col-sm-10"><input id="f_pic" type="text" class="form-control" value="${value}" placeholder="请输入海报链接..."></div>
                </div>`;
        };
        const titleModel = (value = '') => {
            return `<div class="form-group" id="d_title">
                <label for="f_title" class="col-sm-2 control-label">标题</label>
                <div class="col-sm-10"><input id="f_title" type="text" class="form-control" value="${value}" placeholder="请输入标题..."></div>
                </div>`;
        };
        const typeModel = (value = '', disabled = false) => {
            const movieChecked = value === typeMovie ? 'checked' : '';
            const animeChecked = value === typeAnime ? 'checked' : '';
            const tvChecked = value === typeTV ? 'checked' : '';
            const disabledAttr = disabled ? 'disabled' : '';
            return `<div class="form-group"><label for="f_type" class="col-sm-2 control-label">类型</label><div class="col-sm-10">
                <label class="radio-inline"><input name="f_type" type="radio" value="${typeAnime}" ${animeChecked} ${disabledAttr}>动漫</label>
                <label class="radio-inline"><input name="f_type" type="radio" value="${typeMovie}" ${movieChecked} ${disabledAttr}>电影</label>
                <label class="radio-inline"><input name="f_type" type="radio" value="${typeTV}" ${tvChecked} ${disabledAttr}>电视剧</label>
                </div></div>`;
        };
        const progressModel = (value = '') => {
            return `<div class="form-inline">
                <label for="f_progress" class="col-sm-2 control-label">观看进度</label>
                <input id="f_progress" type="text" class="form-control" value="${value}"><button id="p_add" class="btn btn-default active" type="button"><i class="fa fa-plus" aria-hidden="true"></i></button>
                </div><br>`;
        };
        const seenEpModel = (value = '') => {
            return `<div class="form-inline">
                <label for="f_seen_episode" class="col-sm-2 control-label">已观看集数</label>
                <input id="f_seen_episode" type="text" class="form-control" value="${value}"><button id="seen_episode_add" class="btn btn-default active" type="button"><i class="fa fa-plus" aria-hidden="true"></i></button>
                </div><br>`;
        };
        const dateModel = (value = '') => {
            return `<div class="form-group">
                <label for="f_date" class="col-sm-2 control-label">首播日期</label><div class="col-sm-10">
                <input id="f_date" type="date" class="form-control" value="${value}" placeholder="YYYY-MM-DD" onkeydown="this.type='text'" onblur="if(!this.value) this.type='date'">
                </div></div>`;
        };
        const weekModel = () => {
            return `<div class="form-group" id="d_week"><label for="f_week" class="col-sm-2 control-label">周播</label><div class="col-sm-10">
                <label class="checkbox-inline"><input type="checkbox" class="f_week" value="Monday">星期一</label>
                <label class="checkbox-inline"><input type="checkbox" class="f_week" value="Tuesday">星期二</label>
                <label class="checkbox-inline"><input type="checkbox" class="f_week" value="Wednesday">星期三</label>
                <label class="checkbox-inline"><input type="checkbox" class="f_week" value="Thursday">星期四</label>
                <label class="checkbox-inline"><input type="checkbox" class="f_week" value="Friday">星期五</label>
                <label class="checkbox-inline"><input type="checkbox" class="f_week" value="Saturday">星期六</label>
                <label class="checkbox-inline"><input type="checkbox" class="f_week" value="Sunday">星期日</label>
                </div></div>`;
        };
        const timeModel = (value = '') => {
            return `<div class="form-group">
                <label for="f_time" class="col-sm-2 control-label">播出时间</label>
                <div class="col-sm-10"><input id="f_time" type="time" class="form-control" value="${value}"></div>
                </div>`;
        };
        const doubanModel = (value = '') => {
            return `<div class="form-group">
                <label for="f_douban" class="col-sm-2 control-label">豆瓣链接</label>
                <div class="col-sm-10"><input id="f_douban" type="text" class="form-control" value="${value}" placeholder="请输入豆瓣链接，支持自动填充信息..."></div>
                </div>`;
        };
        const bgmModel = (value = '') => {
            return `<div class="form-group">
                <label for="f_bgm" class="col-sm-2 control-label">BGM链接</label>
                <div class="col-sm-10"><input id="f_bgm" type="text" class="form-control" value="${value}" placeholder="请输入BGM链接..."></div>
                </div>`;
        };
        const videoModel = (value = '') => {
            return `<div class="form-group">
                <label for="f_video" class="col-sm-2 control-label">视频链接</label>
                <div class="col-sm-10"><input id="f_video" type="text" class="form-control" value="${value}" placeholder="请输入视频链接..."></div>
                </div>`;
        };

        //时间格式化
        Date.prototype.format = function (format) {
            let o = {
                "M+": this.getMonth() + 1, //month
                "d+": this.getDate(), //day
                "h+": this.getHours(), //hour
                "m+": this.getMinutes(), //minute
                "s+": this.getSeconds(), //second
                "q+": Math.floor((this.getMonth() + 3) / 3), //quarter
                "S": this.getMilliseconds() //millisecond
            };
            format = (format === "") ? "yyyy-MM-dd hh:mm:ss" : format;
            if (/(y+)/.test(format))
                format = format.replace(RegExp.$1, (this.getFullYear() + "").substr(4 - RegExp.$1.length));
            for (let k in o)
                if (new RegExp("(" + k + ")").test(format))
                    format = format.replace(RegExp.$1, RegExp.$1.length === 1 ? o[k] : ("00" + o[k]).substr(("" + o[k]).length));
            return format;
        };

        function number_plus(num, pv) {
            let np = parseInt(num) + pv;
            return np > 9 ? np.toString() : '0' + np
        }

        function progress_add_one(p) {
            p = p.trim()
            if (p === '')
                return "0/1";
            let splits = p.split('/');
            if (splits.length > 0) {
                splits[0] = parseInt(splits[0]) + 1 + '';
            }
            return splits.join('/');
        }

        function seen_episode_add_one(p) {
            if (p == '') {
                return '01';
            }
            if (p.match(/^\d+$/)) {
                return number_plus(p, 1);
            }
            m = p.match(/^(S\d+E)(\d+)$/);
            if (m) {
                return m[1] + number_plus(m[2], 1);
            }
            return p;
        }

        const dayOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        let weekday = dayOfWeek[new Date().getDay()];
        let today = new Date().format("yyyy-MM-dd");

        window.operateEvents = {
            'click .edit': function (e, value, row, index) {
                $('#my_modal div.modal-body').html(['<form class="form-horizontal" role="form">',
                    idModel(row['id']), picModel(row['pic']), titleModel(row['title']),
                    progressModel(row['progress']), seenEpModel(row['seen_episode']),
                    dateModel(row['date']), weekModel(), timeModel(row['time']),
                    doubanModel(row['douban']), bgmModel(row['bgm']), videoModel(row['video']),
                    '</form>'].join(''));
                $('#p_add').click(function () { $('input#f_progress').val(progress_add_one($('input#f_progress').val().trim())); });
                $('#seen_episode_add').click(function () { $('input#f_seen_episode').val(seen_episode_add_one($('input#f_seen_episode').val().trim())); });
                let info = {};
                $.getJSON('/play/info?id=' + row['id'], function (res) {
                    if (res.code === 0) {
                        info = res.data;
                        $('#my_modal #d_title').after(typeModel(res.data.type, true));
                        if (res.data.week !== "") {
                            let week = res.data.week.split(",");
                            $("input:checkbox").each(function () { week.indexOf($(this).val()) >= 0 && $(this).attr("checked", 'checked'); });
                        }
                        if (res.data.type === typeMovie) {
                            $('#my_modal #d_week').hide();
                        }
                    }
                    console.log(res);
                });
                $('#my_modal h4').text("更新影片信息 ...");
                $('#my_modal').modal();
                //submit
                $('#btn_submit').unbind('click');
                $('#btn_submit').click(function () {
                    info.pic = $("input#f_pic").val().trim();
                    info.title = $("input#f_title").val().trim();
                    info.progress = $("input#f_progress").val().trim();
                    info.seen_episode = $("input#f_seen_episode").val().trim();
                    info.week = [];
                    $.each($("input:checkbox:checked"), function () { info.week.push($(this).val()); });
                    info.week = [...new Set(info.week)].filter(item => new Set(dayOfWeek).has(item)).join(",");
                    info.date = $("input#f_date").val().trim();
                    info.time = $("input#f_time").val().trim();
                    info.douban = $("input#f_douban").val().trim();
                    info.bgm = $("input#f_bgm").val().trim();
                    info.video = $("input#f_video").val().trim();
                    info.id = row['id'];
                    console.log(info);
                    $.post('/play/update', info, function (res) {
                        if (res.code === 0) {
                            location.reload();
                        }
                        $('#my_modal button.close').click();
                        new_message(res.code, res.msg);
                        console.log(res);
                    });
                })
            },
            'click .remove': function (e, value, row, index) {
                $.getJSON('/play/delete?id=' + row['id'], function (res) {
                    if (res.code === 0) {
                        $('#table').bootstrapTable('remove', { field: 'id', values: [row['id']] });
                    }
                    new_message(res.code, res.msg);
                    console.log(res);
                });
            },
            'click .add_one': function (e, value, row, index) {
                $.getJSON('/play/info?id=' + row['id'], function (res) {
                    if (res.code === 0) {
                        let info = res.data;
                        info.progress = progress_add_one(info.progress);
                        info.seen_episode = seen_episode_add_one(info.seen_episode);
                        $.post('/play/update', info, function (res) {
                            if (res.code === 0) {
                                $('#table').bootstrapTable('remove', { field: 'id', values: [row['id']] });
                                format_append([info]);
                            }
                        })
                    }
                    new_message(res.code, res.msg);
                    console.log(res);
                });
            }
        };

        const fmtURLShowStyle = (url) => {
            if (!url.match(/^https?:\/\//)) return url;
            let icon = '';
            let short = '';
            if (m = url.match(/douban\.com\/subject\/(\d+)/)) { icon = '/icon/douban_favicon.ico'; short = m[1]; }
            else if (m = url.match(/bilibili\.com.*media\/(\w+)/)) { icon = '/icon/bilibili_favicon.ico'; short = m[1]; }
            else if (m = url.match(/bilibili\.com.*play\/(\w+)/)) { icon = '/icon/bilibili_favicon.ico'; short = m[1]; }
            else if (m = url.match(/v\.qq\.com\/x\/cover\/(\w+)/)) { icon = '/icon/txsp_favicon.ico'; short = m[1]; }
            else if (m = url.match(/v\.youku\.com\/v_show\/id_([\w=]+)/)) { icon = '/icon/youku_favicon.svg'; short = m[1]; }
            else { icon = ''; const link = new URL(url); short = link.hostname; }
            return icon
                ? `<a target="_blank" href="${url}"><img src="${icon}" style="height: 16px;"> ${short}</a>`
                : `<a target="_blank" href="${url}">${short}</a>`;
        }

        $('#table').bootstrapTable({
            classes: "table table-hover",
            search: true,
            searchAlign: 'left',
            striped: true,
            sortOrder: "asc",
            sortName: "play_date",
            toolbar: "#toolbar",
            toolbarAlign: "right",
            columns: [{
                field: 'pic',
                title: '海报',
                align: 'center',
                valign: 'middle',
                width: 70,
                formatter: function (pic) {
                    return '<img src="' + pic + '" width="40" />';
                }
            }, {
                field: 'id',
                title: '#',
                align: 'center',
                valign: 'middle',
                visible: false
            }, {
                field: 'type',
                title: '类型',
                align: 'center',
                valign: 'middle',
                width: 70,
                formatter: function (type) {
                    const name = typeName(type);
                    const labelClass = getRandomLabelClass(type);
                    return `<span class="label ${labelClass}">${name}</span>`;
                }
            }, {
                field: 'title',
                title: '标题',
                align: 'center',
                valign: 'middle',
                formatter: function (title) {
                    return '<b>' + title + '</b>';
                }
            }, {
                field: 'date',
                title: '首播日期',
                align: 'center',
                valign: 'middle',
                sortable: 'true',
                formatter: function (date) {
                    if (today === date) {
                        return '<span style="color: red; "><b>' + date + '</b></span>';
                    }
                    return date;
                }
            }, {
                field: 'progress',
                title: '观看进度',
                align: 'center',
                valign: 'middle',
                width: 200,
                formatter: function (prg) {
                    let m = prg.match(/(\d+)\/(\d+)/);
                    if (m && m.length === 3) {
                        let progress = parseInt(100 * m[1] / m[2]);
                        let prg_bar_type = ['progress-bar-success', 'progress-bar-info', 'progress-bar-warning', 'progress-bar-danger'];
                        let prg_bar_index = Math.floor(Math.random() * 4);
                        return `<b>${prg}</b><br><div class="progress progress-striped active" style="height:16px"><div class="progress-bar ${prg_bar_type[prg_bar_index]}" role="progressbar" aria-valuemin="0" aria-valuemax="100" style="width:${progress}%;"></div></div>`;
                    }
                    return '<b>' + prg + '</b>';
                }
            }, {
                field: 'seen_episode',
                title: '已观看集数',
                align: 'center',
                valign: 'middle',
                width: 80,
                formatter: function (seen_episode) {
                    return '<b>' + seen_episode + '</b>';
                }
            }, {
                field: 'week',
                title: '周播',
                align: 'center',
                valign: 'middle',
                width: 80,
                formatter: function (week, item) {
                    if (today === item.play_date && week === dayOfWeek[new Date().getDay()]) {
                        return '<span style="color: red; "><b>' + week + '</b></span>';
                    }
                    return '<b>' + (week === '' ? '--' : week) + '</b>';
                }
            }, {
                field: 'play_date',
                title: '播出日期',
                align: 'center',
                valign: 'middle',
                sortable: 'true',
                width: 150,
                formatter: function (play_date, item) {
                    updated_at = item.updated_at || "";
                    updated_at_show = updated_at || "--";
                    if (
                        (today === play_date && play_date > updated_at) ||
                        (today !== play_date && updated_at && play_date > updated_at)
                    ) {
                        return '<span style="color: red; "><b>' + play_date + '</b><br>' + updated_at_show + '</span>';
                    }
                    return play_date + '<br>' + updated_at_show;
                }
            }, {
                field: 'time',
                title: '播出时间',
                align: 'center',
                valign: 'middle',
                width: 70,
                formatter: function (value, item) {
                    let t_now = new Date().format('hh:mm')
                    if (today === item.play_date && value <= t_now) {
                        return '<span style="color: red; "><b>' + value + '</b></span>';
                    }
                    return value === '' ? '--' : value;
                }
            }, {
                field: 'douban',
                title: '豆瓣链接',
                align: 'center',
                formatter: function (value) { return fmtURLShowStyle(value); },
                valign: 'middle',
                class: 'data-inline'
            }, {
                field: 'bgm',
                title: 'BGM链接',
                align: 'center',
                formatter: function (value) { return fmtURLShowStyle(value); },
                valign: 'middle',
                class: 'data-inline'
            }, {
                field: 'video',
                title: '视频链接',
                align: 'left',
                formatter: function (value) { return fmtURLShowStyle(value); },
                valign: 'middle',
                class: 'data-inline'
            }, {
                field: 'operate',
                title: '操作',
                align: 'center',
                valign: 'middle',
                events: window.operateEvents,
                formatter: function () {
                    return [
                        '<a class="add_one" href="javascript:void(0)" title="Add"><i class="fa fa-plus" aria-hidden="true"></i></a>',
                        '<a class="edit" href="javascript:void(0)" title="Edit"><i class="fa fa-edit fa-fw"></i></a>',
                        '<a class="remove" href="javascript:void(0)" title="Delete"><i class="fa fa-trash"></i></a>'
                    ].join('&nbsp;&nbsp;&nbsp;&nbsp;');
                }
            }],
            pagination: true,
            sidePagination: "client",
            pageSize: 50,
            pageList: [10, 25, 50, 100, 200, "ALL"],
            escape: true
        });

        function format_append(data) {
            let d = {
                "Sunday": [],
                "Monday": [],
                "Tuesday": [],
                "Wednesday": [],
                "Thursday": [],
                "Friday": [],
                "Saturday": []
            };
            let m = [];
            const today = new Date().format("yyyy-MM-dd");
            for (let key in data) {
                if (data[key].type === typeMovie) {
                    data[key].play_date = data[key].date;
                    m.push(data[key]);
                    continue;
                }
                if (data[key].date > today) {
                    data[key].play_date = data[key].date;
                    m.push(data[key]);
                    continue;
                }
                let week = data[key].week.split(',');
                for (let w in week) {
                    if (d.hasOwnProperty(week[w])) {
                        let { ...temp } = data[key];
                        temp['week'] = week[w];
                        d[week[w]].push(temp)
                    }
                }
            }
            let index = new Date().getDay();
            for (let i = index; i < dayOfWeek.length; i++) {
                d[dayOfWeek[i]].sort(function (a, b) {
                    return a.date === b.date ? (a.time > b.time ? 1 : -1) : (a.date > b.date ? 1 : -1);
                });
                for (let key in d[dayOfWeek[i]]) {
                    table_append(d[dayOfWeek[i]][key], dayOfWeek[i]);
                }
            }
            for (let i = 0; i < index; i++) {
                d[dayOfWeek[i]].sort(function (a, b) {
                    return a.date === b.date ? (a.time > b.time ? 1 : -1) : (a.date > b.date ? 1 : -1);
                });
                for (let key in d[dayOfWeek[i]]) {
                    table_append(d[dayOfWeek[i]][key], dayOfWeek[i]);
                }
            }
            for (let k in m) {
                table_append(m[k]);
            }
        }

        function table_append(data, next_weekday = '') {
            if (next_weekday !== '') {
                let dayOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
                let indexToday = dayOfWeek.indexOf(weekday);
                let indexNext = dayOfWeek.indexOf(next_weekday);
                data.play_date = new Date(new Date().getTime() + 24 * 60 * 60 * 1000 * ((7 + indexNext - indexToday) % 7)).format("yyyy-MM-dd");
            }
            $("#table").bootstrapTable('append', {
                'pic': data.pic,
                'id': data.id,
                'type': data.type,
                'title': data.title,
                'progress': data.progress,
                'seen_episode': data.seen_episode,
                'week': data.week,
                'date': data.date,
                'play_date': data.play_date,
                'updated_at': data.updated_at,
                'time': data.time,
                'douban': data.douban,
                'bgm': data.bgm,
                'video': data.video,
                "operate": ""
            });
        }

        var msg_timeout;

        function new_message(code, msg) {
            if (msg_timeout) clearTimeout(msg_timeout);
            if (code == 0) {
                $('div#div_info').html('<div class="alert alert-success">' + msg + '</div>');
            } else {
                $('div#div_info').html('<div class="alert alert-error">' + msg + '</div>');
            }
            msg_timeout = setTimeout(function () {
                $('div#div_info').html('');
            }, 3000);
        }

        $('#back_up').click(function () {
            $.getJSON('/play/backup', function (data) {
                console.log(data);
                new_message(data.code, data.msg);
            });
        });

        $('#new_site').click(function () {
            const now = new Date().format("hh:mm");
            $('#my_modal div.modal-body').html(['<form class="form-horizontal" role="form">',
                picModel(), titleModel(), typeModel(),
                progressModel(), seenEpModel('0'), dateModel(), weekModel(), timeModel(now),
                doubanModel(), bgmModel(), videoModel(),
                '</form>'].join(''));
            $('#p_add').click(function () { $('input#f_progress').val(progress_add_one($('input#f_progress').val().trim())); });
            $('#seen_episode_add').click(function () { $('input#f_seen_episode').val(seen_episode_add_one($('input#f_seen_episode').val().trim())); });
            $('#my_modal h4').text("新建影片信息 ...");
            $('#my_modal').modal();
            $("#my_modal input[name='f_type']").change(function () {
                let type = parseInt($("input[name='f_type']:checked").val());
                if (type === typeMovie) {
                    $('#my_modal #f_progress').val("0/1");
                    $('#my_modal #f_time').val("");
                    $('#my_modal #d_week').hide();
                } else if (type === typeAnime || type === typeTV) {
                    $('#my_modal #f_progress').val("0/12");
                    $('#my_modal #f_time').val(now);
                    $('#my_modal #d_week').show();
                }
            });
            $('#btn_submit').unbind('click');
            $('#btn_submit').click(function () {
                let data = {};
                data.pic = $("input#f_pic").val().trim();
                data.title = $("input#f_title").val().trim();
                data.type = parseInt($("input[name='f_type']:checked").val());
                data.progress = $("input#f_progress").val().trim();
                data.seen_episode = $("input#f_seen_episode").val().trim();
                data.week = [];
                $.each($("input:checkbox:checked"), function () { data.week.push($(this).val()); });
                data.week = [...new Set(data.week)].filter(item => new Set(dayOfWeek).has(item)).join(",");
                data.date = $("input#f_date").val().trim();
                data.time = $("input#f_time").val().trim();
                data.douban = $("input#f_douban").val().trim();
                data.bgm = $("input#f_bgm").val().trim();
                data.video = $("input#f_video").val().trim();
                if (data.pic === '' || data.title === '' || isNaN(data.type) || data.date === '') {
                    alert("请至少填写标题、海报、类型和首播日期");
                    return;
                }
                console.log(data);
                $.post('/play/add', { 'data': JSON.stringify(data) }, function (res) {
                    $('#my_modal button.close').click();
                    location.reload();
                    new_message(res.code, res.msg);
                    console.log(res);
                });
            });
        });

        function get_data() {
            $.getJSON('/play/data', function (data) {
                console.log(data);
                format_append(data.data);
            });
        }

        $(document).ready(get_data());

        setTimeout(function () { location.reload(); }, 1800 * 1000);
    </script>
</body>

</html>
